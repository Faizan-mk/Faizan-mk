name: Update profile art

"on":
  schedule:
    - cron: "17 1 * * *"   # ~06:17 Pakistan time, daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["profile.json", "scripts/**", "assets/**"]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save --no-package-lock simple-icons@13 && node scripts/export_icons.js
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/aurora.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json *.svg"
